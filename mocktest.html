<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thi thử - Luyện Nói</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-styles">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #090E17; /* Dark navy background */
      color: #ffffff;
    }

    /* Custom glow effects */
    .glow-cyan {
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
      border: 1px solid rgba(0, 255, 255, 0.6);
      background-color: transparent;
      color: #00ffff;
    }
    
    .glow-pink {
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
      background-color: #ff00ff;
      color: #ffffff;
    }
    
    .glow-blue-border {
      border: 1px solid rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3) inset, 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Sidebar active link background */
    .sidebar-active-bg {
      background: linear-gradient(90deg, rgba(0, 255, 255, 0.15) 0%, transparent 100%);
      border-left: 3px solid #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    /* Neon text gradients */
    .text-gradient-blue {
      background: linear-gradient(90deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Decorative line */
    .decorative-line {
      height: 1px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0) 0%, rgba(56, 189, 248, 0.5) 50%, rgba(56, 189, 248, 0) 100%);
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden antialiased">
<!-- BEGIN: Sidebar -->
<aside class="w-64 flex-shrink-0 bg-[#0F172A] flex flex-col relative z-10">
<!-- Top section: Logo and Nav -->
<div class="p-6 flex-1">
<!-- Logo -->
<div class="flex items-center gap-3 mb-10">
<div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold text-xl glow-blue">S</div>
<h1 class="text-xl font-bold tracking-wide">Luyện Nói</h1>
</div>
<!-- Navigation -->
<nav class="space-y-2">
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors" href="#">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="font-medium text-sm">Trang chủ</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors" href="#">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="font-medium text-sm">Luyện theo câu</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 rounded-lg text-white sidebar-active-bg transition-colors" href="#">
<svg class="h-5 w-5 text-blue-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="font-medium text-sm">Thi thử</span>
</a>
</nav>
</div>
<!-- Bottom section: User info -->
<div class="p-6 border-t border-slate-800/50 space-y-4">
<!-- Credits -->
<div class="flex flex-col items-center gap-2 mb-6">
<div class="relative w-16 h-16 rounded-full border-4 border-slate-800 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-4 border-slate-700 border-t-blue-500 transform rotate-45"></div>
<div class="flex items-baseline gap-1">
<span class="text-xl font-bold text-slate-300">0</span>
<span class="text-xs text-slate-500">rts</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-2.5 px-4 rounded-lg border border-slate-700 bg-slate-800/30 text-slate-300 text-sm font-medium hover:bg-slate-700/50 transition-colors">
        Mua thêm
      </button>
<!-- Account Dropdown -->
<button class="w-full flex items-center justify-between py-2 px-1 text-slate-400 hover:text-white transition-colors">
<div class="flex items-center gap-2 text-sm">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
          Tài khoản
        </div>
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</aside>
<!-- END: Sidebar -->
<!-- BEGIN: Main Content -->
<main class="flex-1 flex flex-col relative overflow-hidden bg-[#0B1120]">
<!-- Background glows -->
<div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-blue-900/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute top-1/4 right-0 w-[400px] h-[400px] bg-pink-900/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="flex-1 overflow-y-auto p-10 relative z-10">
<div class="max-w-6xl mx-auto h-full flex flex-col">
<!-- Header Section -->
<header class="flex justify-between items-start mb-12">
<div class="pt-8">
<h2 class="text-4xl font-bold mb-3 text-white">Thi thử</h2>
<p class="text-slate-400 text-sm max-w-md">Làm thử bài test và nhận điểm SPEAKING sát điểm thi thật.</p>
<!-- Filter Buttons -->
<div class="flex flex-wrap gap-4 mt-8">
<button class="px-6 py-2.5 rounded-full font-semibold text-sm transition-all bg-[#1e3a8a] border border-[#00f0ff] shadow-[0_0_10px_#00f0ff] text-[#00f0ff]">
                THI PART 1
              </button>
<button class="px-6 py-2.5 rounded-full font-semibold text-sm transition-all bg-[#1e3a8a] border border-[#00f0ff] shadow-[0_0_10px_#00f0ff] text-[#00f0ff]">
                THI PART 2
              </button>
<button class="px-6 py-2.5 rounded-full font-semibold text-sm transition-all bg-[#1e3a8a] border border-[#00f0ff] shadow-[0_0_10px_#00f0ff] text-[#00f0ff]">
                THI PART 3
              </button>
<button class="px-6 py-2.5 rounded-full font-bold text-sm transition-all bg-[#ec4899] shadow-[0_0_15px_#ff00ff] text-white">
                FULL TEST
              </button>
</div>
</div>
<!-- Hero Illustration -->
<div class="hidden lg:block relative w-[300px] h-[250px]">
<!-- Using placeholder for the 3D illustration -->
<img alt="Speaking Illustration" class="w-full h-full object-contain mix-blend-screen opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCpk_EtsgLDosVTXCDlLwja2BzfrCiQO9dJt_vi4UqSmvWSRPv0pxos0ZW-waWIhzfFqFFgGZpZgF8EZOoVqFQhgd5A-0S56w9fUVr5QCDCPlaAP9gPxjHdc5uQBTxpgPM8hJ9HTOx-d6gyybsJMf-1lWA8fG7Y3gGN6NPqX5A6q27LIY3BJ6DDoqc2QkVogzi5g47NMxAC0LURu2oIuQcpQCL2MMPHDqXxqiTpuCFzgYvqgemTfqmE1hO5CbRrL5y-Hry45rYAjXwI"/>
</div>
</header>
<!-- Divider Line -->
<div class="decorative-line w-full mb-16"></div>
<!-- Empty State Content -->
<div class="flex-1 flex flex-col items-center justify-center">
<div class="flex flex-col items-center text-center space-y-6">
<!-- Glowing Box Icon -->
<div class="relative w-32 h-24 rounded-xl border border-blue-400/30 bg-blue-900/10 backdrop-blur-md shadow-[0_0_30px_rgba(56,189,248,0.2)] flex flex-col overflow-hidden mb-4">
<!-- Mock browser header -->
<div class="h-6 border-b border-blue-400/20 flex items-center px-3 gap-1.5">
<div class="w-2 h-2 rounded-full bg-slate-600"></div>
<div class="w-2 h-2 rounded-full bg-slate-600"></div>
<div class="w-2 h-2 rounded-full bg-slate-600"></div>
</div>
<!-- Content area -->
<div class="flex-1 bg-gradient-to-br from-blue-500/5 to-pink-500/5"></div>
<!-- Decorative glow orbs behind the box -->
<div class="absolute -top-4 -left-4 w-12 h-12 bg-blue-400/30 rounded-full blur-xl"></div>
<div class="absolute -bottom-4 -right-4 w-12 h-12 bg-pink-400/20 rounded-full blur-xl"></div>
</div>
<p class="text-slate-400 text-sm">Chưa có bài thi nào.</p>
<button class="px-8 py-2.5 rounded-full bg-slate-900/50 text-slate-300 font-medium text-sm glow-blue-border hover:bg-slate-800 transition-colors">
              Chưa có bài thi nào
            </button>
</div>
</div>
</div>
</div>
</main>
<!-- END: Main Content -->
</body></html>
