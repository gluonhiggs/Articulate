name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger: fire the full 5-leg matrix from the Actions UI on any
  # branch without cutting a tag. Lets us test bundle shape and smoke on
  # Linux/macOS (we can do Windows locally) before spending a version number.
  # The release-upload step below is gated on push+tag so manual runs don't
  # publish anything — they build + verify and stop.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Phase 1: Build the React frontend once ──────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: bun run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Phase 2: Bundle Python backend per platform × variant ────────────────────
  # 5-leg matrix: 2x Windows (cpu/gpu), 2x Linux (cpu/gpu), 1x macOS (cpu only).
  # macOS has no CUDA backend in ctranslate2, so GPU variant is excluded.
  build-backend:
    name: Build backend (${{ matrix.os }} ${{ matrix.variant }})
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        variant: [cpu, gpu]
        exclude:
          - os: macos-latest
            variant: gpu
        include:
          - os: windows-latest
            short_os: windows
          - os: ubuntu-latest
            short_os: linux
          - os: macos-latest
            short_os: macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        # Pin uv: prevents silent CI regressions on uv releases.
        run: pip install "uv==0.10.0"

      - name: Install dependencies (CPU variant)
        if: matrix.variant == 'cpu'
        # CPU variant: faster-whisper + ctranslate2 only. No nvidia-* wheels.
        # Bundle stays ~510 MB; ctranslate2 falls back to CPU/int8 at runtime.
        run: uv sync --group build --group local-transcription --no-group dev

      - name: Install dependencies (GPU variant)
        if: matrix.variant == 'gpu'
        # GPU variant: add nvidia cuBLAS + cuDNN + cudart. Bundle ~1.7 GB.
        # sys_platform markers in local-transcription-gpu skip nvidia on macOS,
        # but macOS-GPU is excluded from the matrix anyway.
        run: uv sync --group build --group local-transcription --group local-transcription-gpu --no-group dev

      - name: Verify nvidia imports (GPU legs)
        if: matrix.variant == 'gpu'
        # Belt + suspenders for backend.spec's loud-fail nvidia collect. If a
        # dep-group member is missing from the sync (regression in uv resolver
        # or pyproject.toml), catch it here before PyInstaller runs so the
        # error message points at the real cause, not a downstream bundle shape
        # failure.
        run: uv run --no-sync python -c "import nvidia.cublas, nvidia.cudnn, nvidia.cuda_runtime"

      - name: Build PyInstaller bundle
        # --no-sync: forbid uv run from triggering a second sync that could prune the venv.
        # ARTICULATE_BUILD_GPU: backend.spec gates the nvidia collect_dynamic_libs on this.
        env:
          ARTICULATE_BUILD_GPU: ${{ matrix.variant == 'gpu' && '1' || '0' }}
        run: uv run --no-sync pyinstaller backend.spec --noconfirm --clean

      - name: Verify bundle integrity
        shell: bash
        env:
          MATRIX_VARIANT: ${{ matrix.variant }}
        # Delegated to scripts/verify-bundle.py so CI and local Makefile targets
        # run the exact same checks on all OSes (bash not required). See the
        # Makefile's `release-cpu` / `release-gpu` targets for the local wrapper.
        run: uv run --no-sync python scripts/verify-bundle.py

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.short_os }}-${{ matrix.variant }}
          path: dist/articulate_backend/
          retention-days: 1

  # ── Phase 3: Package Electron app per platform × variant ─────────────────────
  # Same 5-leg matrix as Phase 2. ARTICULATE_VARIANT flows into electron-builder's
  # artifactName template so each installer is distinctly named on the release page.
  build-electron:
    name: Package Electron (${{ matrix.os }} ${{ matrix.variant }})
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        variant: [cpu, gpu]
        exclude:
          - os: macos-latest
            variant: gpu
        include:
          - os: windows-latest
            short_os: windows
            installer-glob: "electron/dist-installer/*.exe"
          - os: ubuntu-latest
            short_os: linux
            installer-glob: "electron/dist-installer/*.AppImage"
          - os: macos-latest
            short_os: macos
            installer-glob: "electron/dist-installer/*.dmg"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.short_os }}-${{ matrix.variant }}
          path: dist/articulate_backend/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Electron dependencies
        working-directory: electron
        run: bun install --frozen-lockfile

      - name: Compile TypeScript
        working-directory: electron
        run: bun run build

      - name: Package with electron-builder
        working-directory: electron
        env:
          # ARTICULATE_VARIANT is interpolated into electron/package.json's
          # artifactName template so we produce e.g. Articulate-windows-gpu-0.1.4.exe.
          ARTICULATE_VARIANT: ${{ matrix.variant }}
          # macOS notarization (optional — set secrets in GitHub repo settings)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun run package

      - name: Create GitHub Release and upload installer
        # Gate on push+tag so workflow_dispatch runs exercise the full build
        # and verify path without publishing. Manual runs stop after Package.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Create release if it doesn't exist yet (idempotent across matrix jobs)
          gh release create "${{ github.ref_name }}" \
            --title "Articulate ${{ github.ref_name }}" \
            --generate-notes \
            2>/dev/null || true
          # Upload the installer
          for f in ${{ matrix.installer-glob }}; do
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
