name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ── Phase 1: Build the React frontend once ──────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: bun run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Phase 2: Bundle Python backend per platform × variant ────────────────────
  # 5-leg matrix: 2x Windows (cpu/gpu), 2x Linux (cpu/gpu), 1x macOS (cpu only).
  # macOS has no CUDA backend in ctranslate2, so GPU variant is excluded.
  build-backend:
    name: Build backend (${{ matrix.os }} ${{ matrix.variant }})
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        variant: [cpu, gpu]
        exclude:
          - os: macos-latest
            variant: gpu
        include:
          - os: windows-latest
            short_os: windows
          - os: ubuntu-latest
            short_os: linux
          - os: macos-latest
            short_os: macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        # Pin uv: prevents silent CI regressions on uv releases.
        run: pip install "uv==0.10.0"

      - name: Install dependencies (CPU variant)
        if: matrix.variant == 'cpu'
        # CPU variant: faster-whisper + ctranslate2 only. No nvidia-* wheels.
        # Bundle stays ~510 MB; ctranslate2 falls back to CPU/int8 at runtime.
        run: uv sync --group build --group local-transcription --no-group dev

      - name: Install dependencies (GPU variant)
        if: matrix.variant == 'gpu'
        # GPU variant: add nvidia cuBLAS + cuDNN + cudart. Bundle ~1.7 GB.
        # sys_platform markers in local-transcription-gpu skip nvidia on macOS,
        # but macOS-GPU is excluded from the matrix anyway.
        run: uv sync --group build --group local-transcription --group local-transcription-gpu --no-group dev

      - name: Verify nvidia imports (GPU legs)
        if: matrix.variant == 'gpu'
        # Belt + suspenders for backend.spec's loud-fail nvidia collect. If a
        # dep-group member is missing from the sync (regression in uv resolver
        # or pyproject.toml), catch it here before PyInstaller runs so the
        # error message points at the real cause, not a downstream bundle shape
        # failure.
        run: uv run --no-sync python -c "import nvidia.cublas, nvidia.cudnn, nvidia.cuda_runtime"

      - name: Build PyInstaller bundle
        # --no-sync: forbid uv run from triggering a second sync that could prune the venv.
        # ARTICULATE_BUILD_GPU: backend.spec gates the nvidia collect_dynamic_libs on this.
        env:
          ARTICULATE_BUILD_GPU: ${{ matrix.variant == 'gpu' && '1' || '0' }}
        run: uv run --no-sync pyinstaller backend.spec --noconfirm --clean

      - name: Verify bundle integrity
        shell: bash
        env:
          ARTICULATE_NO_INTERACTIVE: "1"
          ARTICULATE_PORT: "8765"
          # Pin smoke test to groq so the 10s window doesn't trigger a ~486 MB
          # Whisper model download. CI verifies "bundle starts"; exercising local
          # mode end-to-end is out of scope for smoke.
          TRANSCRIPTION_MODE: "groq"
          MATRIX_VARIANT: ${{ matrix.variant }}
        run: |
          set -uo pipefail
          BUNDLE="dist/articulate_backend/_internal"

          echo "=== Presence check (variant=${MATRIX_VARIANT}) ==="
          # Shipped in every variant, every OS:
          PACKAGES="uvicorn spacy kokoro torch pydantic_core faster_whisper ctranslate2"
          for pkg in $PACKAGES; do
            if [ ! -d "$BUNDLE/$pkg" ]; then
              echo "FAIL: $BUNDLE/$pkg is missing — bundle is incomplete"
              exit 1
            fi
            echo "OK: $pkg"
          done

          if [ "${MATRIX_VARIANT}" = "gpu" ]; then
            # PyInstaller can flatten nvidia.* (PEP 420 namespace package) into
            # _internal/ root OR keep _internal/nvidia/*/bin/ hierarchy. Don't
            # rely on directory existence — grep for the actual DLL/SO filenames.
            echo "=== GPU check: CUDA runtime libs ==="
            FOUND=$(find "$BUNDLE" \
              -iname "cublas64*.dll" -o -iname "libcublas*.so*" \
              -o -iname "cudart64*.dll" -o -iname "libcudart*.so*" \
              -o -iname "cudnn*.dll" -o -iname "libcudnn*.so*" \
              2>/dev/null | wc -l)
            if [ "$FOUND" -lt 3 ]; then
              echo "FAIL: GPU variant bundled only ${FOUND} CUDA libs; expected >= 3 (cuBLAS, cuDNN, cudart)"
              find "$BUNDLE" -iname "*cuda*" -o -iname "*cublas*" -o -iname "*cudnn*" 2>/dev/null | head -20 || true
              exit 1
            fi
            echo "OK: ${FOUND} CUDA runtime files present"
          else
            # CPU variant must NOT ship nvidia libs — check for absence.
            echo "=== CPU check: no CUDA runtime ==="
            NVIDIA_LIBS=$(find "$BUNDLE" \
              -iname "cublas64*.dll" -o -iname "libcublas*.so*" \
              -o -iname "cudnn*.dll" -o -iname "libcudnn*.so*" \
              2>/dev/null | wc -l)
            if [ "$NVIDIA_LIBS" -gt 0 ]; then
              echo "FAIL: CPU variant bundle contains ${NVIDIA_LIBS} CUDA libs — should be 0"
              exit 1
            fi
            echo "OK: CPU variant has no CUDA libs"
          fi

          echo "=== Size check ==="
          SIZE_MB=$(du -sm dist/articulate_backend | cut -f1)
          echo "Bundle size: ${SIZE_MB} MB"
          # Size floors per variant/OS:
          #   macOS (cpu only): ~510 MB → floor 400
          #   Win/Linux CPU:    ~510 MB → floor 450
          #   Win/Linux GPU:    ~1.7 GB → floor 1000
          if [ "${MATRIX_VARIANT}" = "gpu" ]; then
            MIN_MB=1000
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            MIN_MB=400
          else
            MIN_MB=450
          fi
          if [ "$SIZE_MB" -lt "$MIN_MB" ]; then
            echo "FAIL: bundle is ${SIZE_MB} MB, expected >= ${MIN_MB} MB for ${RUNNER_OS}/${MATRIX_VARIANT}"
            exit 1
          fi

          echo "=== Smoke test ==="
          EXE="dist/articulate_backend/articulate_backend"
          [ -f "${EXE}.exe" ] && EXE="${EXE}.exe"
          ls -la "$EXE" || true
          # Windows windowed exes (console=False) have no usable stdout, so shell
          # redirection captures nothing. backend_launcher.py honours ARTICULATE_LOG_PATH
          # and writes sys.stdout/stderr to the file itself — works on all three OSes.
          ARTICULATE_LOG_PATH=smoke.log "$EXE" &
          PID=$!
          sleep 10
          EXIT=0
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            EXIT=124
          else
            # Process exited before 10s; capture its code without tripping `set -e`.
            wait "$PID" || EXIT=$?
          fi
          echo "--- smoke.log (first 80 lines) ---"
          head -80 smoke.log || true
          echo "--- end log ---"
          if [ "$EXIT" -ne 124 ]; then
            echo "FAIL: backend exited with code $EXIT (expected it to still be running after 10s)"
            exit 1
          fi
          echo "Smoke test passed"

      - name: Upload backend bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.short_os }}-${{ matrix.variant }}
          path: dist/articulate_backend/
          retention-days: 1

  # ── Phase 3: Package Electron app per platform × variant ─────────────────────
  # Same 5-leg matrix as Phase 2. ARTICULATE_VARIANT flows into electron-builder's
  # artifactName template so each installer is distinctly named on the release page.
  build-electron:
    name: Package Electron (${{ matrix.os }} ${{ matrix.variant }})
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        variant: [cpu, gpu]
        exclude:
          - os: macos-latest
            variant: gpu
        include:
          - os: windows-latest
            short_os: windows
            installer-glob: "electron/dist-installer/*.exe"
          - os: ubuntu-latest
            short_os: linux
            installer-glob: "electron/dist-installer/*.AppImage"
          - os: macos-latest
            short_os: macos
            installer-glob: "electron/dist-installer/*.dmg"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download backend bundle
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.short_os }}-${{ matrix.variant }}
          path: dist/articulate_backend/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Electron dependencies
        working-directory: electron
        run: bun install --frozen-lockfile

      - name: Compile TypeScript
        working-directory: electron
        run: bun run build

      - name: Package with electron-builder
        working-directory: electron
        env:
          # ARTICULATE_VARIANT is interpolated into electron/package.json's
          # artifactName template so we produce e.g. Articulate-windows-gpu-0.1.4.exe.
          ARTICULATE_VARIANT: ${{ matrix.variant }}
          # macOS notarization (optional — set secrets in GitHub repo settings)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun run package

      - name: Create GitHub Release and upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Create release if it doesn't exist yet (idempotent across matrix jobs)
          gh release create "${{ github.ref_name }}" \
            --title "Articulate ${{ github.ref_name }}" \
            --generate-notes \
            2>/dev/null || true
          # Upload the installer
          for f in ${{ matrix.installer-glob }}; do
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done
