name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check + build
        run: bun run build

      - name: Run tests
        run: bun run test

  backend-checks:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # Skip local-transcription group (faster-whisper + CUDA): too heavy for CI.
        # Skip torch: it's in main deps but ~800MB; tests needing it are marked
        # requires_models and excluded below. Also skip kokoro and spacy for the
        # same reason (they depend on torch or are large model packages).
        run: >
          uv sync --group dev --no-group local-transcription
          --no-install-package torch
          --no-install-package kokoro
          --no-install-package spacy
          --no-install-package en-core-web-sm

      - name: Run tests
        # Skip tests that require heavy ML models (torch/kokoro/whisper).
        # Mark those tests with @pytest.mark.requires_models.
        run: uv run pytest tests/ -x --tb=short -m "not requires_models"
