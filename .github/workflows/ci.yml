name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check + build
        run: bun run build

      - name: Run tests
        run: bun run test

  backend-checks:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # Flag list (skip local-transcription, torch, kokoro, spacy,
        # en-core-web-sm) lives in the Makefile's install-backend target so
        # contributors running `make install-backend` get byte-identical behavior
        # to this CI step. Change the flags there, not here.
        run: make install-backend

      - name: Run tests
        # Mirrors `make test-backend`. Skips @pytest.mark.requires_models tests
        # (heavy ML: torch/kokoro/whisper).
        run: make test-backend
