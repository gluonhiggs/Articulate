[project]
name = "articulate"
version = "0.1.0"
description = "IELTS speaking practice app backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "aiofiles>=24.0",
    # torch: CPU-only by default (laptop).
    # On PC (Windows, CUDA), after `uv sync` run:
    #   uv pip install torch --index-url https://download.pytorch.org/whl/cu121
    "torch>=2.3",
    "kokoro>=0.3",
    "en-core-web-sm>=3.8.0",
    # Grammar checker — optional enhancement, requires Java on host system.
    # Falls back gracefully if Java is not installed.
    "language-tool-python>=2.7",
    "simplemma>=1.0",
    "lexicalrichness>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# Force CPU-only PyTorch — avoids downloading 3GB+ of CUDA libraries on laptop.
# PC users override with CUDA torch after sync (see run.ps1).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
# GPU inference (Windows/Linux, NVIDIA only).
# Install with: uv pip install -e ".[gpu]"
# run.ps1 handles this automatically on the pc profile.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
