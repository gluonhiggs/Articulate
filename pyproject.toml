[project]
name = "articulate"
version = "0.1.7"
description = "IELTS speaking practice app backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "groq>=0.8",
    "aiofiles>=24.0",
    # torch: CPU-only (used by Kokoro TTS only - transcription uses Groq API in Mode 2
    # or faster-whisper in Mode 1; faster-whisper's CUDA support is independent of torch).
    "torch>=2.3",
    "kokoro>=0.3",
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Grammar checker - optional enhancement, requires Java on host system.
    # Falls back gracefully if Java is not installed.
    "language-tool-python>=2.7",
    "simplemma>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.metadata]
allow-direct-references = true

# Force CPU-only PyTorch - Kokoro TTS only needs CPU torch; no CUDA required.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Icon generation for desktop app (scripts/create_icons.py)
    "pillow>=10.0",
    "icnsutil>=1.1.0",
    # Linter + formatter. Also used by the pre-commit hook, which manages its
    # own separate copy — this entry is for `make check` / `make format` / CI.
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.0",
]
local-transcription = [
    "faster-whisper>=1.0",
    # Pin ctranslate2 to the cuDNN-v9 era; >=4.5 changes the cuDNN major dep,
    # and <5 keeps us on a range the transcription fallback paths are tested against.
    "ctranslate2>=4.5,<5",
]
# GPU-only CUDA runtime. CI installs this group on GPU matrix legs (Win/Linux);
# CPU variants skip it entirely so those installers stay ~510 MB instead of ~1.7 GB.
# macOS is excluded via the sys_platform marker — ctranslate2 has no CUDA backend on macOS.
# The wheels install DLLs into site-packages/nvidia/*/bin/ (Windows) or
# site-packages/nvidia/*/lib/ (Linux); transcription.py patches PATH/LD on import.
local-transcription-gpu = [
    "nvidia-cublas-cu12>=12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12>=12; sys_platform != 'darwin'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Ruff: Python linter + formatter. Run via pre-commit or `uv run ruff check .`
# Conservative starter config; expand selected rules as the codebase absorbs
# the auto-fixes.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "frontend",
    "dist",
    "build",
    ".venv",
]

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes (real bugs), I = isort import order.
# Add B (bugbear), UP (pyupgrade), SIM (simplify) later when ready.
select = ["E", "F", "I"]
# E501 (line too long) is enforced by the formatter, not the linter.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
