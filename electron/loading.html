<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articulate — Starting…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    p  { font-size: 0.875rem; color: #94a3b8; text-align: center; max-width: 340px; line-height: 1.6; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1e293b;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note {
      font-size: 0.75rem;
      color: #64748b;
      max-width: 320px;
      text-align: center;
      line-height: 1.5;
    }
    #slow-note { display: none; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Articulate</h1>
  <p id="status-msg">Starting backend…</p>
  <p class="note" id="slow-note">
    First launch may take a few minutes while the AI voice model downloads (~330 MB).
    Subsequent launches will be much faster.
  </p>
  <script>
    // Show the slow-note after 10 seconds (first-run Kokoro download).
    setTimeout(() => {
      document.getElementById('slow-note').style.display = 'block';
      document.getElementById('status-msg').textContent = 'Downloading AI models (first launch only)…';
    }, 10000);
  </script>
</body>
</html>
